<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueueGOO Diagnostico Dev</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e3f2fd;
        color: #1e232c;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px;
      }
      .toolbar,
      .card {
        background: #fff;
        border: 1px solid #b3e5fc;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
        align-items: end;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #4b6475;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #b3e5fc;
        border-radius: 8px;
        min-height: 40px;
        padding: 8px 10px;
      }
      button {
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        background: #0d47a1;
        color: #fff;
        font-weight: 800;
        padding: 0 16px;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f8fcff;
        border: 1px solid #e3f2fd;
        border-radius: 8px;
        padding: 10px;
      }
      .ok { color: #1b7f3a; }
      .erro { color: #c62828; }
      .info { color: #b7791f; }
      @media (max-width: 760px) {
        .toolbar { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QueueGOO Diagnostico Dev</h1>
      <p>Use somente localmente. O endpoint do backend responde apenas com <code>DEBUG=true</code>.</p>

      <section class="toolbar">
        <div>
          <label for="baseUrl">Backend local</label>
          <input id="baseUrl" value="http://localhost:8000" />
        </div>
        <div>
          <label for="token">x-diagnostic-token, se configurado</label>
          <input id="token" placeholder="Opcional" />
        </div>
        <button id="run">Rodar</button>
      </section>

      <section id="output"></section>
    </main>

    <script>
      const output = document.querySelector('#output');
      document.querySelector('#run').addEventListener('click', async () => {
        output.innerHTML = '<div class="card">Carregando...</div>';
        const baseUrl = document.querySelector('#baseUrl').value.replace(/\/$/, '');
        const token = document.querySelector('#token').value.trim();
        const headers = token ? { 'x-diagnostic-token': token } : {};

        try {
          const response = await fetch(`${baseUrl}/diagnostico`, { headers });
          const data = await response.json();

          if (!response.ok) {
            output.innerHTML = `<div class="card erro"><strong>Erro HTTP ${response.status}</strong><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
            return;
          }

          output.innerHTML = data.testes.map((teste) => `
            <article class="card">
              <h2 class="${teste.status}">${teste.nome} - ${teste.status}</h2>
              <pre>${JSON.stringify(teste, null, 2)}</pre>
            </article>
          `).join('');
        } catch (error) {
          output.innerHTML = `<div class="card erro"><strong>Falha ao consultar backend</strong><pre>${String(error)}</pre></div>`;
        }
      });
    </script>
  </body>
</html>
